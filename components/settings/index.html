<!--suppress HtmlUnknownTarget, HtmlUnknownTag -->
<link rel="stylesheet" href="components/settings/style.css">

<section>
  <main>
    <div id="controls">
      <ens-fab id="escape">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
             class="icon icon-tabler icons-tabler-outline icon-tabler-arrow-down">
          <path stroke="none" d="M0 0h24v24H0z" fill="none" />
          <path d="M12 5l0 14" />
          <path d="M18 13l-6 6" />
          <path d="M6 13l6 6" />
        </svg>
        <span slot="text">hide menu</span>
      </ens-fab>
      <ens-fab id="mount">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
             class="icon icon-tabler icons-tabler-outline icon-tabler-folder-open">
          <path stroke="none" d="M0 0h24v24H0z" fill="none" />
          <path
            d="M5 19l2.757 -7.351a1 1 0 0 1 .936 -.649h12.307a1 1 0 0 1 .986 1.164l-.996 5.211a2 2 0 0 1 -1.964 1.625h-14.026a2 2 0 0 1 -2 -2v-11a2 2 0 0 1 2 -2h4l3 3h7a2 2 0 0 1 2 2v2" />
        </svg>
        <span slot="text">load directory</span>
      </ens-fab>
      <ens-fab id="score">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
             class="icon icon-tabler icons-tabler-outline icon-tabler-music-plus">
          <path stroke="none" d="M0 0h24v24H0z" fill="none" />
          <path d="M3 17a3 3 0 1 0 6 0a3 3 0 0 0 -6 0" />
          <path d="M9 17v-13h10v8" />
          <path d="M9 8h10" />
          <path d="M16 19h6" />
          <path d="M19 16v6" />
        </svg>
        <span slot="text">create score</span>
      </ens-fab>
    </div>
    <ens-browser></ens-browser>
    <div id="tabs">
      <ens-field></ens-field>
      <ens-parameter id="type">
        <span slot="name">type</span>
      </ens-parameter>
      <ens-parameter id="transform">
        <span slot="name">transform</span>
      </ens-parameter>
      <ens-parameter id="encoding">
        <span slot="name">encoding</span>
      </ens-parameter>
      <ens-parameter id="mark">
        <span slot="name">mark</span>
      </ens-parameter>
    </div>
  </main>
</section>
